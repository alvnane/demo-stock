<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO 재고 운영 현황</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 12px;
            color: var(--text-main);
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* 로그인 화면 스타일 */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
        }
        .login-box {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 320px;
        }
        .login-box h3 { margin-top: 0; color: var(--primary-color); }
        .login-input {
            width: 100%; padding: 10px; font-size: 1rem;
            border: 1px solid var(--border-color); border-radius: 8px;
            margin-bottom: 12px; box-sizing: border-box; outline: none;
        }
        .login-btn {
            width: 100%; padding: 10px; font-size: 1rem;
            background-color: var(--primary-color); color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .login-btn:active { background-color: #1d4ed8; }
        .error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 8px; display: none; }

        /* 재고 화면 스타일 */
        #mainScreen { display: none; }
        .header { text-align: center; margin-bottom: 16px; }
        .header h2 { margin: 0 0 4px 0; font-size: 1.25rem; color: var(--primary-color); }
        .search-box {
            width: 100%; padding: 12px 16px; font-size: 1rem;
            border: 2px solid var(--border-color); border-radius: 12px;
            box-sizing: border-box; margin-bottom: 12px; outline: none; background: #fff;
        }
        .search-box:focus { border-color: var(--primary-color); }
        .summary-box {
            background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 10px;
            padding: 10px 14px; margin-bottom: 12px; font-size: 0.9rem; color: #1e40af;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card {
            background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color);
            margin-bottom: 8px; overflow: hidden; cursor: pointer;
        }
        .card-summary { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .item-main { display: flex; flex-direction: column; gap: 2px; }
        .model-name { font-weight: 700; font-size: 0.98rem; color: #0f172a; }
        .sub-model { font-size: 0.82rem; color: #475569; font-weight: 500; }
        .sn-text { font-family: monospace; font-size: 0.85rem; color: var(--primary-color); }
        .location-text { font-size: 0.8rem; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
        .card-detail { display: none; padding: 12px 16px; background-color: #f8fafc; border-top: 1px dashed var(--border-color); }
        .card.active .card-detail { display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 0.85rem; }
        .info-item { display: flex; justify-content: space-between; }
        .info-item.full { grid-column: span 2; }
        .label { color: var(--text-sub); }
        .value { font-weight: 500; color: #334155; text-align: right; }
        .no-result { text-align: center; padding: 40px; color: var(--text-sub); background: #fff; border-radius: 10px; }
    </style>
</head>
<body>

<!-- 1. 로그인 화면 -->
<div id="loginScreen">
    <div class="login-box">
        <h3>🔒 보안 접속</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 16px;">회사 비밀번호를 입력해주세요.</p>
        <input type="password" id="passwordInput" class="login-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkPassword()">
        <button class="login-btn" onclick="checkPassword()">로그인</button>
        <div id="errorMsg" class="error-msg">비밀번호가 틀렸습니다.</div>
    </div>
</div>

<!-- 2. 실제 재고 검색 화면 (비밀번호 맞추기 전에는 숨겨짐) -->
<div id="mainScreen" class="container">
    <div class="header">
        <h2>📦 DEMO 재고 운영 현황</h2>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 모델명 또는 시리얼번호(S/N) 입력..." onkeyup="filterStock()">
    <div class="summary-box">
        <span>총 <strong id="totalCount">0</strong>개</span>
        <span>사무실 재고: <strong id="officeCount">0</strong>개</span>
    </div>
    <div id="stockList">데이터 불러오는 중...</div>
</div>

<script>
    // ★ [중요] 여기에 우리 회사 직원들에게 알려줄 비밀번호를 설정하세요!
    const CORRECT_PASSWORD = "1234utb"; // 원하시는 비밀번호로 변경 가능합니다.

    function checkPassword() {
        const inputVal = document.getElementById("passwordInput").value;
        if(inputVal === CORRECT_PASSWORD) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("mainScreen").style.display = "block";
            loadData(); // 비밀번호가 맞을 때만 데이터를 불러옵니다.
        } else {
            document.getElementById("errorMsg").style.display = "block";
        }
    }

    let stockData = [];
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSZ2HcaXc6zdm_RXnS9f-YYOsPxYpdhk6-fGvSuMoJeM-x1mlSbQtGffzbE895VmNg8_YMKfKqXLT_Y/pub?gid=736675046&single=true&output=csv'; // 혹은 기존에 잘 불러와지던 데이터 연동

    // 이전 버전에서 정상 작동하던 초기 데이터 또는 구글시트 연동 로직
    const initialData = [{"제조사": "SCAPE", "구분": "ETC", "적용모델": "X5", "모델명": "CART", "sn": "0804418996", "재고": "SCAPE", "현황": "사무실", "병원명": "-", "담당대리점": "-", "담당자": "-", "기타": "현금담보 x"}];
    // (참고: 구글 시트 데이터를 불러오는 방식을 기존에 쓰셨던 코드로 유지하시면 됩니다.)
</script>

</body>
</html>
