<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO 재고 운영 현황 및 예약</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --reserved-bg: #fef2f2;
            --reserved-border: #fca5a5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 12px;
            color: var(--text-main);
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* 로그인 화면 스타일 */
        #loginScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center;
        }
        .login-box {
            background: #fff; padding: 24px; border-radius: 12px; border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 320px;
        }
        .login-box h3 { margin-top: 0; color: var(--primary-color); }
        .login-input {
            width: 100%; padding: 10px; font-size: 1rem; border: 1px solid var(--border-color);
            border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; outline: none;
        }
        .login-btn {
            width: 100%; padding: 10px; font-size: 1rem; background-color: var(--primary-color);
            color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 8px; display: none; }

        /* 재고 화면 스타일 */
        #mainScreen { display: none; }
        .header { text-align: center; margin-bottom: 16px; }
        .header h2 { margin: 0 0 4px 0; font-size: 1.25rem; color: var(--primary-color); }
        .search-box {
            width: 100%; padding: 12px 16px; font-size: 1rem; border: 2px solid var(--border-color);
            border-radius: 12px; box-sizing: border-box; margin-bottom: 12px; outline: none; background: #fff;
        }
        .search-box:focus { border-color: var(--primary-color); }
        .summary-box {
            background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 10px;
            padding: 10px 14px; margin-bottom: 12px; font-size: 0.9rem; color: #1e40af;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card {
            background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color);
            margin-bottom: 8px; overflow: hidden; transition: all 0.2s;
        }
        /* 예약된 경우 카드 색상 변경 */
        .card.is-reserved {
            background-color: var(--reserved-bg);
            border-color: var(--reserved-border);
        }
        .card-summary { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .item-main { display: flex; flex-direction: column; gap: 2px; }
        .model-name { font-weight: 700; font-size: 0.98rem; color: #0f172a; }
        .sub-model { font-size: 0.82rem; color: #475569; font-weight: 500; }
        .sn-text { font-family: monospace; font-size: 0.85rem; color: var(--primary-color); }
        .location-text { font-size: 0.8rem; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }
        
        .card-detail { display: none; padding: 12px 16px; background-color: #f8fafc; border-top: 1px dashed var(--border-color); }
        .card.active .card-detail { display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 0.85rem; }
        .info-item { display: flex; justify-content: space-between; }
        .info-item.full { grid-column: span 2; }
        .label { color: var(--text-sub); }
        .value { font-weight: 500; color: #334155; text-align: right; }

        /* 예약 영역 스타일 */
        .reservation-section {
            margin-top: 10px; padding-top: 10px; border-top: 1px solid #cbd5e1;
            display: flex; flex-direction: column; gap: 8px;
        }
        .reservation-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .reservation-inputs input {
            width: 100%; padding: 6px 8px; font-size: 0.85rem; border: 1px solid var(--border-color);
            border-radius: 6px; box-sizing: border-box;
        }
        .reserve-btn {
            background-color: #2563eb; color: white; border: none; padding: 8px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .cancel-btn {
            background-color: #dc2626; color: white; border: none; padding: 8px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        .reserved-badge {
            background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px;
            font-size: 0.75rem; font-weight: bold; margin-left: 4px;
        }
        .no-result { text-align: center; padding: 40px; color: var(--text-sub); background: #fff; border-radius: 10px; }
    </style>
</head>
<body>

<!-- 1. 로그인 화면 -->
<div id="loginScreen">
    <div class="login-box">
        <h3>🔒 보안 접속</h3>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 16px;">회사 비밀번호를 입력해주세요.</p>
        <input type="password" id="passwordInput" class="login-input" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkPassword()">
        <button class="login-btn" onclick="checkPassword()">로그인</button>
        <div id="errorMsg" class="error-msg">비밀번호가 틀렸습니다.</div>
    </div>
</div>

<!-- 2. 실제 재고 검색 화면 -->
<div id="mainScreen" class="container">
    <div class="header">
        <h2>📦 DEMO 재고 운영 현황 및 예약</h2>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 모델명 또는 시리얼번호(S/N) 입력..." onkeyup="filterStock()">
    <div class="summary-box">
        <span>총 <strong id="totalCount">0</strong>개</span>
        <span>사무실 재고: <strong id="officeCount">0</strong>개</span>
    </div>
    <div id="stockList">데이터 불러오는 중...</div>
</div>

<script>
    const CORRECT_PASSWORD = "1234"; // 회사 비밀번호
    let stockData = [];
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSZ2HcaXc6zdm_RXnS9f-YYOsPxYpdhk6-fGvSuMoJeM-x1mlSbQtGffzbE895VmNg8_YMKfKqXLT_Y/pub?gid=736675046&single=true&output=csv';

    function checkPassword() {
        const inputVal = document.getElementById("passwordInput").value;
        if(inputVal === CORRECT_PASSWORD) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("mainScreen").style.display = "block";
            loadData();
        } else {
            document.getElementById("errorMsg").style.display = "block";
        }
    }

    async function loadData() {
        try {
            const response = await fetch(CSV_URL);
            const csvText = await response.text();
            parseCSV(csvText);
        } catch (error) {
            console.error("데이터 로딩 실패:", error);
            document.getElementById("stockList").innerHTML = `<div class="no-result">데이터를 불러오지 못했습니다.</div>`;
        }
    }

    function parseCSV(text) {
        const lines = text.split("\n");
        stockData = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"\vert{}"$/g, ''));
            if(cols.length >= 8) {
                stockData.push({
                    index: i, // 구글 시트 행 번호
                    제조사: cols[1] || '',
                    구분: cols[2] || '',
                    적용모델: cols[3] || '',
                    모델명: cols[4] || '',
                    sn: cols[5] || '',
                    재고: cols[6] || '',
                    현황: cols[7] || '',
                    병원명: cols[11] || '-',
                    담당대리점: cols[12] || '-',
                    담당자: cols[13] || '-',
                    기타: cols[14] || '-',
                    예약상태: cols[15] || '',
                    예약담당자: cols[16] || '',
                    사용날짜: cols[17] || '',
                    예약병원명: cols[18] || ''
                });
            }
        }
        displayData(stockData);
    }

    function displayData(data) {
        const listDiv = document.getElementById("stockList");
        const total = data.length;
        const office = data.filter(item => String(item.현황).includes("사무실")).length;

        document.getElementById("totalCount").innerText = total;
        document.getElementById("officeCount").innerText = office;

        if(data.length === 0) {
            listDiv.innerHTML = `<div class="no-result">일치하는 재고가 없습니다.</div>`;
            return;
        }

        let html = "";
        data.forEach((item) => {
            const isReserved = item.예약상태 === "예약됨";
            const cardClass = isReserved ? "card is-reserved" : "card";
            const badge = isReserved ? `<span class="reserved-badge">예약중 (${item.사용날짜})</span>` : '';

            html += `
                <div class="${cardClass}" id="card-${item.index}">
                    <div class="card-summary" onclick="toggleDetail(${item.index})">
                        <div class="item-main">
                            <span class="model-name">${item.모델명 || '-'}${badge}</span>
                            <span class="sub-model">적용모델: ${item.적용모델 || '-'}</span>
                            <span class="sn-text">S/N: ${item.sn || '-'}</span>
                        </div>
                        <div class="location-text">
                            <span>${item.현황 || '미지정'}</span>
                            <span>▼</span>
                        </div>
                    </div>
                    <div class="card-detail" id="detail-${item.index}">
                        <div class="info-grid">
                            <div class="info-item"><span class="label">적용모델</span><span class="value">${item.적용모델 || '-'}</span></div>
                            <div class="info-item"><span class="label">제조사</span><span class="value">${item.제조사 || '-'}</span></div>
                            <div class="info-item"><span class="label">구분</span><span class="value">${item.구분 || '-'}</span></div>
                            <div class="info-item"><span class="label">재고</span><span class="value">${item.재고 || '-'}</span></div>
                            <div class="info-item full"><span class="label">병원명</span><span class="value">${item.병원명}</span></div>
                            <div class="info-item"><span class="label">담당대리점</span><span class="value">${item.담당대리점}</span></div>
                            <div class="info-item"><span class="label">담당자</span><span class="value">${item.담당자}</span></div>
                            ${item.기타 !== '-' ? `<div class="info-item full"><span class="label">기타</span><span class="value" style="color:#d97706;">${item.기타}</span></div>` : ''}
                        </div>

                        <!-- 예약 입력 및 취소 영역 -->
                        <div class="reservation-section">
                            ${isReserved ? `
                                <div style="font-size:0.85rem; color:#991b1b; font-weight:500;">
                                    📌 예약 정보: ${item.사용날짜} / 담당: ${item.예약담당자} / 병원: ${item.예약병원명}
                                </div>
                                <button class="cancel-btn" onclick="cancelReservation(${item.index})">예약 취소하기</button>
                            ` : `
                                <div class="reservation-inputs">
                                    <input type="text" id="manager-${item.index}" placeholder="담당자 이름">
                                    <input type="date" id="date-${item.index}">
                                </div>
                                <input type="text" id="hospital-${item.index}" placeholder="예약 병원명">
                                <button class="reserve-btn" onclick="makeReservation(${item.index})">예약하기</button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        });
        listDiv.innerHTML = html;
    }

    function toggleDetail(index) {
        const detailDiv = document.getElementById(`detail-${index}`);
        const cardDiv = document.getElementById(`card-${index}`);
        if(detailDiv.style.display === "block") {
            detailDiv.style.display = "none";
            cardDiv.classList.remove("active");
        } else {
            detailDiv.style.display = "block";
            cardDiv.classList.add("active");
        }
    }

    function filterStock() {
        const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
        if(!keyword) {
            displayData(stockData);
            return;
        }
        const filtered = stockData.filter(item => {
            return String(item.모델명).toLowerCase().includes(keyword) || String(item.sn).toLowerCase().includes(keyword);
        });
        displayData(filtered);
    }

    // 예약 실행 함수 (실제 운영 시 구글 앱스 스크립트 연동 또는 폼 전송 활용)
    function makeReservation(index) {
        const manager = document.getElementById(`manager-${index}`).value.trim();
        const date = document.getElementById(`date-${index}`).value;
        const hospital = document.getElementById(`hospital-${index}`).value.trim();

        if(!manager || !date || !hospital) {
            alert("담당자, 사용날짜, 병원명을 모두 입력해주세요!");
            return;
        }

        alert(`[예약 완료]\n담당자: ${manager}\n날짜: ${date}\n병원: ${hospital}\n\n※ 구글 시트 연동 후 저장됩니다.`);
        // 실제 데이터 반영 로직 (구글 앱스 스크립트 웹앱 주소 연동 필요)
    }

    function cancelReservation(index) {
        if(confirm("예약을 취소하시겠습니까?")) {
            alert("예약이 취소되었습니다.");
            // 예약 취소 반영 로직
        }
    }
</script>

</body>
</html>
